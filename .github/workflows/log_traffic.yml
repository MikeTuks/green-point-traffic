name: Log traffic

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Log now even if no window is active"
        type: boolean
        default: false

concurrency:
  group: log-traffic
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for an active window
        id: check
        run: python scripts/log_traffic.py --check ${{ inputs.force && '--force' || '' }}

      - name: Install dependencies
        if: steps.check.outputs.active == 'true'
        run: pip install -q -r requirements.txt

      - name: Log readings
        if: steps.check.outputs.active == 'true'
        env:
          TOMTOM_API: ${{ secrets.TOMTOM_API }}
          TOMTOM_HOME: ${{ secrets.TOMTOM_HOME }}
          TOMTOM_DEST: ${{ secrets.TOMTOM_DEST }}
          TOMTOM_OUT_WAYPOINTS: ${{ secrets.TOMTOM_OUT_WAYPOINTS }}
          TOMTOM_RET_WAYPOINTS: ${{ secrets.TOMTOM_RET_WAYPOINTS }}
        run: python scripts/log_traffic.py ${{ inputs.force && '--force' || '' }}

      - name: Commit and push
        if: steps.check.outputs.active == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/traffic
          git diff --cached --quiet && exit 0
          git commit -m "Log traffic readings"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
