name: Tests

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - requirements.txt
      - .github/workflows/tests.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r requirements.txt pytest==9.1.1

      - name: Run tests
        run: python -m pytest -q tests
